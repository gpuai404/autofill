<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Autofill Scanner Fixtures</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 24px;
      color: #1f2937;
      background: #f8fafc;
    }

    main {
      max-width: 1120px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 16px;
    }

    button {
      padding: 8px 12px;
      border: 1px solid #94a3b8;
      background: #fff;
      border-radius: 6px;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
      background: #fff;
      border: 1px solid #cbd5e1;
    }

    th,
    td {
      border-bottom: 1px solid #e2e8f0;
      padding: 10px;
      text-align: left;
      vertical-align: top;
      font-size: 14px;
    }

    th {
      background: #e2e8f0;
      font-weight: 650;
    }

    .pass {
      color: #166534;
      font-weight: 650;
    }

    .fail {
      color: #991b1b;
      font-weight: 650;
    }

    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      margin: 0;
      max-height: 260px;
      overflow: auto;
    }

    iframe {
      position: absolute;
      width: 960px;
      height: 720px;
      left: -2000px;
      top: 0;
      border: 0;
    }
  </style>
</head>
<body>
  <main>
    <h1>Scanner Fixtures</h1>
    <button id="run">Run fixtures</button>
    <table>
      <thead>
        <tr>
          <th>Fixture</th>
          <th>Status</th>
          <th>Details</th>
        </tr>
      </thead>
      <tbody id="results"></tbody>
    </table>
  </main>
  <script src="runner.js"></script>
</body>
</html>
