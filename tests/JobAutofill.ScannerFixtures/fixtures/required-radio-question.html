<!doctype html>
<html lang="en">
<body>
  <sr-screening-question>
    <div id="spl-form-element_100">
      <p class="c-spl-question-label">
        Please ask us if you are uncertain whether you may need immigration sponsorship or desire clarification during your interview process. *
      </p>
      <label><input type="radio" name="sponsorshipClarification" value="yes"> Yes</label>
      <label><input type="radio" name="sponsorshipClarification" value="no"> No</label>
    </div>
  </sr-screening-question>

  <sr-screening-question>
    <div id="spl-form-element_101">
      <p class="c-spl-question-label">Are you legally authorized to work in the United States?</p>
      <label><input type="radio" name="authorized" value="yes"> Yes</label>
      <label><input type="radio" name="authorized" value="no"> No</label>
    </div>
  </sr-screening-question>
</body>
</html>
