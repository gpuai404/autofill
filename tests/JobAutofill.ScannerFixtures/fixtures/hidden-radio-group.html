<!doctype html>
<html lang="en">
<body>
  <form>
    <fieldset role="radiogroup" aria-required="true">
      <legend>Are you legally authorized to work in the United States?</legend>
      <label class="c-spl-radio">
        <input type="radio" name="authorized" value="yes" style="position:absolute;opacity:0;width:0;height:0">
        <span class="c-spl-radio-control" aria-hidden="true"></span>
        Yes
      </label>
      <label class="c-spl-radio">
        <input type="radio" name="authorized" value="no" style="position:absolute;opacity:0;width:0;height:0">
        <span class="c-spl-radio-control" aria-hidden="true"></span>
        No
      </label>
    </fieldset>
  </form>
</body>
</html>
